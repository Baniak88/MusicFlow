# XcodeGen spec: `xcodegen generate` creates MusicFlow.xcodeproj (not committed).
name: MusicFlow
options:
  bundleIdPrefix: app.musicflow
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  MusicFlow:
    type: application
    platform: iOS
    sources:
      - path: MusicFlow
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.musicflow.ios
        PRODUCT_NAME: MusicFlow
        INFOPLIST_FILE: MusicFlow/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
  MusicFlowTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MusicFlowTests
    dependencies:
      - target: MusicFlow
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.musicflow.ios.tests
  MusicFlowUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: MusicFlowUITests
    dependencies:
      - target: MusicFlow
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.musicflow.ios.uitests
        TEST_TARGET_NAME: MusicFlow
schemes:
  MusicFlow:
    build:
      targets:
        MusicFlow: all
    test:
      gatherCoverageData: false
      targets:
        - MusicFlowTests
        - MusicFlowUITests
