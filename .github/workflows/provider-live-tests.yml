name: Provider live tests

# Runs the opt-in live tests (real YouTube Music / SoundCloud requests) on GitHub's network.
# Manual only: results depend on the services and on rate limits for CI IP addresses.
on:
  workflow_dispatch:
    inputs:
      tests:
        description: "Test filter, e.g. *SoundCloudLive* or *YouTubeLive* (empty = all live tests)"
        required: false
        default: "*SoundCloudLive*"

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-37.0 build-tools;36.0.0 platform-tools"
      - uses: gradle/actions/setup-gradle@v4
      - name: Live tests
        run: |
          FILTER="${{ github.event.inputs.tests }}"
          ./gradlew :data:providers:testDebugUnitTest -PliveTests=true --tests "${FILTER:-*Live*}" -i --console=plain 2>&1 \
            | grep -E "^(tracks|stream|playlist|segment|track|related|set|artist|songs|page2|skip)|Test.*(PASSED|FAILED|SKIPPED)|> Task|BUILD|Exception|expected|but was" || true
          exit ${PIPESTATUS[0]}
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-test-reports
          path: data/providers/build/reports/tests/
          if-no-files-found: ignore
