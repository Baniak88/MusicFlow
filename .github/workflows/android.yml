name: Android CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Lint, unit tests, APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-37.0 build-tools;36.0.0 platform-tools"

      - name: Set up Gradle (with dependency cache)
        uses: gradle/actions/setup-gradle@v4

      # Stable debug/test signing key, so test builds update in place (no uninstall, library kept).
      # Kept in the Actions cache (never in git); see BUILD.md.
      - name: Restore test signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: musicflow-test-signing-key-v1

      - name: Lint
        run: ./gradlew lint --stacktrace

      - name: Unit tests
        run: ./gradlew test --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug -PversionCode=${{ github.run_number }} --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-lint-reports
          path: |
            **/build/reports/tests/
            **/build/reports/lint-results-*.html
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MusicFlow-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Signed release APK, only when signing secrets exist (never committed to the repo).
      - name: Decode release keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.MUSICFLOW_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK
        if: steps.keystore.outputs.path != ''
        env:
          MUSICFLOW_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          MUSICFLOW_KEYSTORE_PASSWORD: ${{ secrets.MUSICFLOW_KEYSTORE_PASSWORD }}
          MUSICFLOW_KEY_ALIAS: ${{ secrets.MUSICFLOW_KEY_ALIAS }}
          MUSICFLOW_KEY_PASSWORD: ${{ secrets.MUSICFLOW_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease -PversionCode=${{ github.run_number }} --stacktrace

      - name: Upload signed release APK
        if: steps.keystore.outputs.path != ''
        uses: actions/upload-artifact@v4
        with:
          name: MusicFlow-release-${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
