name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-37.0 build-tools;36.0.0 platform-tools"

      - uses: gradle/actions/setup-gradle@v4

      - name: Derive version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Unit tests
        run: ./gradlew test --stacktrace

      - name: Decode release keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.MUSICFLOW_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        env:
          MUSICFLOW_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          MUSICFLOW_KEYSTORE_PASSWORD: ${{ secrets.MUSICFLOW_KEYSTORE_PASSWORD }}
          MUSICFLOW_KEY_ALIAS: ${{ secrets.MUSICFLOW_KEY_ALIAS }}
          MUSICFLOW_KEY_PASSWORD: ${{ secrets.MUSICFLOW_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease :app:assembleDebug \
            -PversionName=${{ steps.version.outputs.name }} -PversionCode=${{ github.run_number }} --stacktrace

      - name: Collect versioned APKs
        run: |
          mkdir dist
          V=${{ steps.version.outputs.name }}
          if ls app/build/outputs/apk/release/app-release.apk >/dev/null 2>&1; then
            cp app/build/outputs/apk/release/app-release.apk "dist/MusicFlow-$V.apk"
          else
            # No signing secrets configured: publish the debug-signed APK, clearly labelled.
            cp app/build/outputs/apk/debug/app-debug.apk "dist/MusicFlow-$V-debug.apk"
          fi
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          # Tags like v1.0.0-beta.1 are published as pre-releases (test builds).
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: docs/RELEASE_NOTES_TESTING.md
