name: Release

on:
  push:
    tags: ["v*"]
  # Manual release from the Actions tab (or API): the workflow creates the tag itself.
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to create, e.g. v1.0.0-beta.1 (a '-' suffix marks a pre-release)"
        required: true
      new_signing_key:
        description: "Allow a NEW test signing key (testers must uninstall once). Only for first setup or a lost key."
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-37.0 build-tools;36.0.0 platform-tools"

      - uses: gradle/actions/setup-gradle@v4

      # Stable test signing key, so beta builds update in place (no uninstall, library kept).
      # Kept in the Actions cache (never in git); see BUILD.md. A missing key is never silently
      # replaced: that would force every tester to uninstall.
      - name: Restore test signing key
        id: testkey
        uses: actions/cache/restore@v4
        with:
          path: ~/.musicflow-test-key/test.jks
          key: musicflow-test-signing-key-v2

      - name: Create test signing key (first setup only)
        if: steps.testkey.outputs.cache-hit != 'true'
        run: |
          if [ "${{ github.event.inputs.new_signing_key }}" != "true" ]; then
            echo "::error::Test signing key not found in the Actions cache. Publishing with a new key would force testers to uninstall. Re-run with new_signing_key=true only if that is intended."
            exit 1
          fi
          mkdir -p ~/.musicflow-test-key
          keytool -genkeypair -keystore ~/.musicflow-test-key/test.jks -storetype PKCS12 \
            -alias musicflow-test -storepass musicflow-test -keypass musicflow-test \
            -keyalg RSA -keysize 4096 -validity 36500 -dname "CN=MusicFlow test builds"

      - name: Save new test signing key
        if: steps.testkey.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.musicflow-test-key/test.jks
          key: musicflow-test-signing-key-v2

      - name: Use test signing key
        run: |
          test -s ~/.musicflow-test-key/test.jks
          echo "MUSICFLOW_TEST_KEYSTORE=$HOME/.musicflow-test-key/test.jks" >> "$GITHUB_ENV"

      - name: Derive version from tag
        id: version
        run: |
          TAG="${{ github.event.inputs.version || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Unit tests
        run: ./gradlew test --stacktrace

      - name: Decode release keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.MUSICFLOW_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        env:
          MUSICFLOW_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          MUSICFLOW_KEYSTORE_PASSWORD: ${{ secrets.MUSICFLOW_KEYSTORE_PASSWORD }}
          MUSICFLOW_KEY_ALIAS: ${{ secrets.MUSICFLOW_KEY_ALIAS }}
          MUSICFLOW_KEY_PASSWORD: ${{ secrets.MUSICFLOW_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease :app:assembleBeta \
            -PversionName=${{ steps.version.outputs.name }} -PversionCode=${{ github.run_number }} --stacktrace

      - name: Collect versioned APKs
        run: |
          mkdir dist
          V=${{ steps.version.outputs.name }}
          if ls app/build/outputs/apk/release/app-release.apk >/dev/null 2>&1; then
            cp app/build/outputs/apk/release/app-release.apk "dist/MusicFlow-$V.apk"
          else
            # No release signing secrets: publish the optimised test build (".beta", test key).
            cp app/build/outputs/apk/beta/app-beta.apk "dist/MusicFlow-$V-beta.apk"
          fi
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)

      # Guard: a beta must be signed like the previous beta, or it cannot install as an update.
      - name: Check signature matches the previous beta
        if: hashFiles('dist/*-beta.apk') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          cert() { "$APKSIGNER" verify --print-certs "$1" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1; }
          NEW=$(cert dist/*-beta.apk)
          echo "New beta certificate SHA-256: $NEW"
          # Newest beta by version number (the API's order is not guaranteed to be by version).
          PREV=$(gh api "repos/${{ github.repository }}/releases?per_page=50" --jq '[.[] | select(.draft|not) | select(any(.assets[]?; .name | endswith("-beta.apk"))) | .tag_name | select(. != "${{ steps.version.outputs.tag }}")] | sort_by(capture("(?<a>[0-9]+)[.](?<b>[0-9]+)[.](?<c>[0-9]+)(-beta[.](?<d>[0-9]+))?") | [(.a|tonumber), (.b|tonumber), (.c|tonumber), ((.d // "999999")|tonumber)]) | last // empty')
          if [ -z "$PREV" ]; then echo "No previous beta release."; exit 0; fi
          mkdir -p prev && gh release download "$PREV" -R "${{ github.repository }}" -p "*-beta.apk" -D prev
          OLD=$(cert prev/*-beta.apk)
          echo "Previous ($PREV) certificate SHA-256: $OLD"
          if [ "$NEW" != "$OLD" ]; then
            if [ "${{ github.event.inputs.new_signing_key }}" = "true" ]; then
              echo "::warning::Signing key changed on purpose; testers must uninstall once."
            else
              echo "::error::Signing key differs from $PREV; testers could not update. Not publishing."
              exit 1
            fi
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          # Tags like v1.0.0-beta.1 are published as pre-releases (test builds).
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: MusicFlow ${{ steps.version.outputs.name }}
          prerelease: ${{ contains(steps.version.outputs.tag, '-') }}
          body_path: docs/RELEASE_NOTES_TESTING.md
